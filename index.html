<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <title>Le Puckboard</title>
  <link rel="stylesheet" href="style/variables.css">
  <link rel="stylesheet" href="style/nav.css">
  <link rel="stylesheet" href="style/base.css">
  <link rel="stylesheet" href="style/games.css">
  <link rel="stylesheet" href="style/home.css">
  <link rel="stylesheet" href="style/player-card.css">
  <link rel="stylesheet" href="style/tier-badge.css">
</head>

<body>
  <main>
    <h1>Le Puckboard</h1>
    <p class="page-sub">NHL stats, matchups &amp; goalie comparisons</p>

    <section class="section">
      <h2 class="section-title">
        Tonight's games
        <span class="muted">times in ET</span>
        <a class="see-all" href="games.html">All games →</a>
      </h2>
      <div id="tonightGames" class="games-grid"></div>
    </section>

    <section class="section">
      <h2 class="section-title">Standings</h2>
      <div class="standings-tabs" id="standingsTabs"></div>
      <div class="card table-scroll">
        <table class="mini-table standings-table">
          <thead>
            <tr>
              <th>Team</th>
              <th>GP</th>
              <th>W</th>
              <th>L</th>
              <th>OTL</th>
              <th>PTS</th>
              <th>GF</th>
              <th>GA</th>
              <th>DIFF</th>
              <th>P%</th>
            </tr>
          </thead>
          <tbody id="standingsBody"></tbody>
        </table>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">League leaders</h2>
      <div class="leaders-grid" id="leadersGrid"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="js/nav.js" type="module"></script>
  <script src="js/home.js" type="module"></script>
</body>

</html>
